name: Build Windows

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set versioned artifact name
        id: artifact
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          echo "name=PAN-Kontaktliste-${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: cmd
        run: |
          pyinstaller --onefile --windowed --name "${{ steps.artifact.outputs.name }}" ^
            --icon "data/app-icon.ico" ^
            --add-data "data/placeholder.png;data" ^
            --add-data "data/app-icon.png;data" ^
            --add-data "template;template" ^
            --add-data "pyproject.toml;." ^
            --collect-submodules reportlab.graphics.barcode ^
            gui.py

      - name: Create zip
        run: |
          Compress-Archive -Path "dist\${{ steps.artifact.outputs.name }}.exe" -DestinationPath "dist\${{ steps.artifact.outputs.name }}-windows.zip"

      - name: Upload to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "dist/${{ steps.artifact.outputs.name }}.exe" "dist/${{ steps.artifact.outputs.name }}-windows.zip" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
